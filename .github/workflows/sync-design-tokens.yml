name: Sync Design Tokens

on:
  repository_dispatch:
    types: [tokens-release]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Name of branch in Tokens Studio to pull tokens from'
        type: string
        required: false
        default: 'main'

permissions:
  id-token: write # Required for OIDC authentication
  contents: write # Required to push the token branch
  pull-requests: write # Required to open tokens PR

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    env:
      # fallback for `repository_dispatch` event where inputs not populated
      TOKENS_BRANCH: ${{ inputs.branch || 'main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create config file
        run: |
          jq --null-input --arg branch "$TOKENS_BRANCH" '{
            "$schema": "https://tokens.studio/schema/cli/v2.json",
            "outputs": {
              "stand": {
                "format": "dtcg",
                "dir": "src/styleD/tokens"
              }
            },
            "source": {
              "project": "ef220361-80dc-4645-a671-0d38f9293c6b",
              "ref": {
                "type": "branch",
                "name": $branch
              }
            },
            "version": 2
          }' > .studio.json

      - name: Clean Tokens Studio Tokens
        run: |
          rm ./src/styleD/tokens/base/base.json
          rm ./src/styleD/tokens/semantic/semantic.json
          rm ./src/styleD/tokens/component/component.json

      - name: Pull tokens from Studio
        run: pnpm dlx @tokens-studio/studio-cli pull --ci

      - name: Format token files
        run: pnpm run format:fix

      - name: Build tokens
        run: pnpm run build-styled

      # Use the Guardian Changesets app credentials so generated PRs trigger pull_request workflows;
      # PRs created with GITHUB_TOKEN do not trigger workflows like CI or Chromatic.
      - name: Use GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GU_CHANGESETS_APP_ID }}
          private-key: ${{ secrets.GU_CHANGESETS_PRIVATE_KEY }}

      - name: Create branch and open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add -- src/styleD
          if ! git diff --cached --quiet -- src/styleD; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            GIT_BRANCH="tokens/update-$(date +%s)"
            git checkout -b "$GIT_BRANCH"
            git commit -m "chore: sync design tokens from Studio"
            git push -u origin "$GIT_BRANCH"

            gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$GIT_BRANCH" \
              --title "chore: sync design tokens from Tokens Studio ($TOKENS_BRANCH)" \
              --body "Automated sync of design tokens from \`$TOKENS_BRANCH\` branch in Tokens Studio." \
              --label maintenance \
              --label run_chromatic
          else
            echo "No token updates to commit."
          fi
